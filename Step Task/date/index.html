</div>
  <script>
//   საკლასო 6.1
// For ციკლის მეშვეობით კონსოლზე გამოიტანეთ 10-დან 120-მდე შუალედიდან ყველა ლუწი ციფრი.
 for (let i = 10; i <=120; i++){
  if (i % 2 === 0){
    console.log(i);
  }
};
// საკლასო 6.2
// მოცემულია მასივი arr. for-of ციკლის მეშვეობით კონსოლზე გამოიტანეთ ამ მასივის ყველა კენტი ელემნტი.
let arr = [2, 2, 3, 4, 5];
for (let item of arr){
  if(item %2 === 1){
    console.log(item)
  }
};
// საკლასო 6.3
// ციკლის საშუალებით გამოიანგარიშეთ 20–დან 90–მდე ყველა კენტი რიცხვის ჯამი.
let sum = 0;
for (let i = 20; i <= 90; i++){
  if(i % 2 !==0){
    sum += i 
  }
  console.log(sum);
}
// საკლასო 6.4
// მოცემულია მასივი arr. კონსოლზე გამოიტანეთ ამ მასივის ის ელემენტები რომლებიც მეტია 30-ზე.
let array = [10, 200, 3, 40, 50];
for (let item of array){
  if(item > 30 ){
    console.log(item)
  }};
//   საკლასო 6.5
// მოცემულია მასივი names. for ციკლის მეშვეობით კონსოლზე გამოიტანეთ მოცემული მასივის ყველა ელემენტი.
let names = ['ხვიჩა', 'გოგა', 'მაკა', 'ანა', 'ინა'];
for (let item of names){
  console.log(item)
};
// საკლასო 6.6
// კონსოლზე თანმიმდევრობით გამოიტანეთ მიმდინარე დღე, თვე და წელი. 
let date = new Date
console.log(date.getDate());
console.log(date.getMonth()+1);
console.log(date.getFullYear());
// საკლასო 6.7
// მოცემულია კვირის დღეების მასივი days. დააადგინეთ თქვენი დაბადების დღე კვირის რომელი დღე იყო და ამ
// მასივის გამოყენებით ეკრანზე გამოიტანეთ.
let days = [
'კვირა','ორშაბათი', 'სამშაბათი', 'ოთხშაბათი', 'ხუთშაბათი',
'პარასკევი', 'შაბათი'
];
let birthday = new Date('1991-06-05');
let dayNumber = birthday.getDay();
console.log(days[dayNumber]);

  </script>
