    <script>

// შექმენით მასივი, რომლის პირველი ორი ელემენტი იქნება რიცხვი შემდეგი ორი ელემნტი სტრინგი. რიგით
// პირველ ელემნტს დაუმატეთ რიგით მეორე ელემნტი და შედეგი გამოიტანეთ ეკრანზე
var array = [9,5, `mystring`, `laststring`];
array[0] +=array[1];
console.log(array[0]);
// დავალება 4.2
// მოცემულია კოდი, რომელმაც კონსოლზე უნდა გამოიტანოს მასივის ელემნტების ჯამი. აღმოაჩინეთ შეცდომა
// კოდში.
let arr = [10, 20, 30, 40, 50];
console.log(arr[1] + arr[2] + arr[3] + arr[4] + arr[5]); 
// შეცდომა მგომარეობს შემდეგში, მასივის პირველი ინდექსის ათვლა იწყება 0 -ით.
//******************************************************************************************************
// დავალება 4.3
// შექმენით ფუნქცია getFirstToy, ისე რომ დააბრუნოს მასზე გადაცემული toys მასივიდან პირველი ელემენტი.
let toys = ['ოვერბორდი', 'პაზლი', 'Lego', 'Yo-yo'];
function getFirstToy(toys) {
    return toys[0]
};
console.log(getFirstToy(toys))
// დავალება 4.4
// მოცემულია მასივი arra. მასივს თავსა და ბოლოში დავამატოთ ახალი ელემენტი, შედეგი კონსოლზე
// გამოვიტანოთ.
let arra = [10, 20, 30, 40, 50];
arra.push(61);//ბოლო +
arra.unshift(16); //თავი +
console.log(arra);
//დავალება 4.5
// მოცემულია მასივი names. წავშალოთ მასივის პირველი და ბოლო ელემენტი, შედეგი კონსოლზე
// გამოვიტანოთ.
let names = ['ხვიჩა', 'გოგა' , 'მაკა', 'ანა', 'ინა']
