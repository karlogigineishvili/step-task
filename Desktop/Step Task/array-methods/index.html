<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>მასივების დავალებები</title>

</head>
<body>
    <script>
//       1.  map() – ელემენტების გარდაქმნა
// მოცემულია რიცხვების მასივი.
// შექმენი ახალი მასივი, სადაც თითოეული რიცხვი გაორმაგებული იქნება.
let array = [ 2,4,5,3,4,6,3,2]
let double = array.map(function(db){
    return db ** 2;
})
console.log(double)
// 2 filter() – გაფილტვრა
// მოცემულია ასაკების მასივი.
// დააბრუნე ახალი მასივი, სადაც დარჩება მხოლოდ 18 წელზე მეტი ასაკის
// ელემენტები.
let age = [23,25,12,7,34,76]
let adult = age.filter(function(age){
    return age > 18
})
console.log(adult)
// 3.  find() – ერთის მოძებნა
// მოცემულია პროდუქტების მასივი (ობიექტები: სახელი და ფასი).
// იპოვე პირველი პროდუქტი, რომლის ფასი აღემატება 100 ლარს
let product = [
    {name : `წიწიბურა`, price: 5 },
    {name : `ტუნა`, price: 8},
    {name : `ავოკადო`, price : 180},
    {name : `ხიზილალა`, price : 350}
];
let above = product.find(function(hundred){
    return hundred.price > 100
});
console.log(above)
// 4 some() – შემოწმება
// მოცემულია რიცხვების მასივი.
// შეამოწმე, არსებობს თუ არა მასივში უარყოფითი რიცხვი.
let locate = [ -1,-7, 8,3,8,4,]
let negative = locate.some(function(neg){
    return neg < 0 
})
console.log(negative)
// 5 reduce() – დაჯამება
// მოცემულია რიცხვების მასივი.
// გამოთვალე ყველა ელემენტის ჯამი ერთი მნიშვნელობის მიღებით.
let number = [23,25,12,7,34,76]
let sum = number.reduce(function(a,b)
{return a+b  } );
console.log(sum);
    </script>
</body>
</html>
